name: CI

on:
  push:
  pull_request:

jobs:
  analyzer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
      - name: Analyzer unit tests (synthetic frames, no simulator)
        run: python3 -m unittest discover -s tools -v

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,ds in d.items() if "iOS" in r for x in ds if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Package tests
        run: |
          xcodebuild test -scheme GlitchDemoKit \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
      - name: Build the demo app
        run: |
          xcodebuild build -project Demo/Demo.xcodeproj -scheme Demo \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
